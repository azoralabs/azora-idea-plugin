# The IntelliJ Platform bundles its own Kotlin standard library. Letting the
# Gradle Kotlin plugin add another copy risks a version clash at runtime.
kotlin.stdlib.default.dependency=false

org.gradle.caching=true
org.gradle.parallel=true

# The Kotlin compile daemon runs out of heap on the larger highlighting files
# and reports it as "Backend Internal error: Exception during IR lowering",
# which reads like a code fault and is not one.
kotlin.daemon.jvmargs=-Xmx3g
